# PLCFACTORY — works as-is for "docker compose up -d" and as a TrueNAS custom app (Install via YAML).
services:
  plcfactory:
    image: ghcr.io/leonidis2013/plcfactory:latest
    container_name: plcfactory
    restart: unless-stopped
    environment:
      - TZ=America/Chicago
      # On first start the web UI opens a setup page to create the administrator.
      # (From outside your LAN it asks for a one-time code printed in the container log.)
      # For unattended installs you can create the admin here instead:
      # - ADMIN_USER=admin
      # - ADMIN_PASSWORD=change-me-please
      # External access (reverse proxy, public URL, cookies, allowed hosts, Modbus) is set in the
      # web UI: Settings tab (admin). Any of these variables, if set here, override and lock that field:
      # - PUBLIC_URL=https://plc.example.com
      # - TRUST_PROXY=true
      # - TRUSTED_PROXIES=private
      # - ALLOWED_HOSTS=plc.example.com
      # - COOKIE_SECURE=auto
      # - SESSION_DAYS=7
      # - MODBUS=on
      # - MODBUS_WRITE=true
      # - MODBUS_ALLOW=private
    ports:
      - "8085:8080"   # web UI   -> http://<server>:8085
      - "502:5020"    # Modbus TCP for SCADA clients — LAN ONLY, never port-forward (Modbus has no login)
    volumes:
      - plcfactory-data:/data   # projects + settings (Docker named volume)

volumes:
  plcfactory-data:
