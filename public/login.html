<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d0f11">
<title>PLCFACTORY — Sign in</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/app.css">
</head>
<body class="login-page">
<header id="top"><div class="brand"><span class="mark"></span><span>PLC<b>FACTORY</b></span></div></header>
<main class="login-wrap">
  <form id="loginForm" class="card login-card" autocomplete="on">
    <h3>Operator sign-in</h3>
    <p class="muted small">Authorised users only. Access is logged.</p>
    <label>Username<input id="u" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required></label>
    <label>Password<input id="p" name="password" type="password" autocomplete="current-password" required></label>
    <div id="err" class="login-err" hidden></div>
    <button class="primary" type="submit" id="go">Sign in</button>
  </form>
</main>
<script src="js/login.js"></script>
</body>
</html>
